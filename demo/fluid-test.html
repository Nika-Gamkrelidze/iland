<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>fluid solver harness</title>
<style>
  html, body { margin: 0; height: 100%; background: #04070C; color: #EEF3F8;
               font: 14px ui-monospace, Menlo, monospace; }
  #c { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  #hud { position: fixed; top: 12px; left: 12px; z-index: 2; background: #0d141fcc;
         border: 1px solid #1D2837; border-radius: 10px; padding: 12px 14px; line-height: 1.7;
         backdrop-filter: blur(8px); max-width: 46ch; }
  b { color: #2FD6B4; }
  button { font: inherit; background: #131C2A; color: inherit; border: 1px solid #2B3949;
           border-radius: 8px; padding: 5px 10px; cursor: pointer; margin-right: 6px; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud">
  <div id="status">booting…</div>
  <div style="margin-top:10px">
    <button id="bPlume">plume()</button>
    <button id="bSeed">seed()</button>
    <button id="bPause">pause/resume</button>
  </div>
  <div style="margin-top:8px;color:#9FADBF">drag anywhere to push the fluid</div>
</div>

<script type="module">
import { createFluid } from './js/fluid.js';

const canvas = document.getElementById('c');
const status = document.getElementById('status');

const f = createFluid(canvas, { palette: ['#2FD6B4', '#FF9F45', '#7FEFD8'] });
window.__fluid = f;

if (!f.supported) {
  status.innerHTML = `<b style="color:#F0554C">unsupported</b> — ${f.reason}`;
} else {
  f.seed(8);
  const s = f.stats();
  status.innerHTML =
    `<b>ok</b> · webgl${f.isWebGL2 ? '2' : '1'} · linear:${f.supportLinear}<br>` +
    `sim ${s.simW}×${s.simH} · dye ${s.dyeW}×${s.dyeH} · dpr ${s.dpr}<br>` +
    `iters ${f.config.pressureIters} · curl ${f.config.curl}`;

  let px = 0, py = 0, down = false;
  addEventListener('pointerdown', e => { down = true; px = e.clientX; py = e.clientY; });
  addEventListener('pointerup', () => { down = false; });
  addEventListener('pointermove', e => {
    if (!down) return;
    f.pointerAt(e.clientX, e.clientY, e.clientX - px, e.clientY - py);
    px = e.clientX; py = e.clientY;
  });

  document.getElementById('bPlume').onclick = () =>
    f.plume(innerWidth / 2, innerHeight * 0.72, { count: 7, force: 1.2 });
  document.getElementById('bSeed').onclick = () => f.seed(6);
  document.getElementById('bPause').onclick = () => (f.running ? f.pause() : f.resume());

  /* expose a pixel probe so the harness can be checked without eyeballing it */
  window.__probe = () => {
    const gl = canvas.getContext('webgl2') || canvas.getContext('webgl');
    const w = canvas.width, h = canvas.height;
    const px2 = new Uint8Array(4 * w * h);
    gl.readPixels(0, 0, w, h, gl.RGBA, gl.UNSIGNED_BYTE, px2);
    let lit = 0, sumR = 0, sumG = 0, sumB = 0, maxA = 0;
    for (let i = 0; i < px2.length; i += 4) {
      const a = px2[i + 3];
      if (a > 8) { lit++; sumR += px2[i]; sumG += px2[i + 1]; sumB += px2[i + 2]; }
      if (a > maxA) maxA = a;
    }
    return { w, h, litPixels: lit, litFraction: +(lit / (w * h)).toFixed(4), maxAlpha: maxA,
             avg: lit ? [Math.round(sumR / lit), Math.round(sumG / lit), Math.round(sumB / lit)] : null };
  };
}
</script>
</body>
</html>
