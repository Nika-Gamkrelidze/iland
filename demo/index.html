<!doctype html>
<html lang="ka" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>iLand — Apple საქართველოში</title>
<meta name="description" content="iLand — Apple-ის ავტორიზებული გაყიდვა და სერვისი თბილისში. განვადება 0%-დან, ორიგინალი ნაწილები, 12 თვე გარანტია.">
<meta name="theme-color" content="#04070C">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%2304070C'/%3E%3Cpath d='M6 20h20' stroke='%232FD6B4' stroke-width='2.5' stroke-linecap='round'/%3E%3Ccircle cx='16' cy='13' r='5' fill='none' stroke='%232FD6B4' stroke-width='2.5'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/app.css">
</head>
<body>

<a class="skip" href="#main">გადადი მთავარ შიგთავსზე</a>
<canvas id="fluid" aria-hidden="true"></canvas>
<div class="progress" aria-hidden="true"></div>

<!-- ── announcement ─────────────────────────────────────────────────────── -->
<div class="marquee" id="marquee" style="position:relative">
  <div class="marquee__track" id="marqueeTrack"></div>
  <button class="marquee__pause" id="marqueePause" aria-pressed="false" aria-label="შეაჩერე ლენტა">⏸</button>
</div>

<!-- ── navigation ───────────────────────────────────────────────────────── -->
<header class="nav" id="nav">
  <div class="wrap nav__inner">
    <a href="#/" class="logo" aria-label="iLand — მთავარი">
      <svg viewBox="0 0 40 40" fill="none" aria-hidden="true">
        <circle class="logo__ring" cx="20" cy="16.5" r="9.5" stroke="currentColor" stroke-width="2.6"
                style="color:var(--accent)" stroke-linecap="round" transform="rotate(-90 20 16.5)"/>
        <path d="M5 29.5h30" stroke="var(--text)" stroke-width="2.8" stroke-linecap="round"/>
        <path d="M12 34.5h16" stroke="var(--text)" stroke-width="2.8" stroke-linecap="round" opacity=".35"/>
      </svg>
      <span class="logo__word">i<b>Land</b></span>
    </a>

    <nav class="nav__list" id="navList" aria-label="კატეგორიები"></nav>

    <div class="nav__tools" style="position:relative">
      <button class="icon-btn nav__burger" id="menuBtn" aria-label="მენიუ" aria-expanded="false">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
          <path d="M4 7h16M4 12h16M4 17h16"/>
        </svg>
      </button>
      <button class="icon-btn" id="searchBtn" aria-label="ძებნა" aria-expanded="false">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
          <circle cx="11" cy="11" r="7"/><path d="m20 20-3.6-3.6"/>
        </svg>
      </button>

      <button class="icon-btn" id="themeBtn" aria-label="თემის შეცვლა">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" id="themeIcon">
          <circle cx="12" cy="12" r="4.5"/>
          <path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5 5l1.4 1.4M17.6 17.6 19 19M19 5l-1.4 1.4M6.4 17.6 5 19"/>
        </svg>
      </button>

      <div class="lang" role="group" aria-label="ენა">
        <button data-lang="ka" aria-pressed="true">ქარ</button>
        <button data-lang="en" aria-pressed="false">EN</button>
        <button data-lang="ru" aria-pressed="false">RU</button>
      </div>

      <button class="icon-btn" id="cartBtn" aria-label="კალათა">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M6 7h13l-1.4 9.3a2 2 0 0 1-2 1.7H9.4a2 2 0 0 1-2-1.7L6 7Z"/>
          <path d="M9 7V5.5a3 3 0 0 1 6 0V7"/>
        </svg>
        <span class="cart-count" id="cartCount" data-n="0">0</span>
      </button>

      <div class="search-pop hide" id="searchPop">
        <input type="search" id="searchInput" placeholder="მოძებნე პროდუქტი…" autocomplete="off" aria-label="ძებნა">
        <div class="search-res" id="searchRes"></div>
      </div>
    </div>
  </div>
</header>

<!-- ── router outlet ────────────────────────────────────────────────────── -->
<main id="main"></main>

<!-- ── footer ───────────────────────────────────────────────────────────── -->
<footer class="foot">
  <div class="wrap">
    <div class="foot__grid" id="footGrid"></div>
    <div class="foot__bar">
      <span id="footLegal"></span>
      <div class="pay">
        <span>VISA</span><span>MASTERCARD</span><span>Apple&nbsp;Pay</span><span>განვადება</span>
      </div>
    </div>
  </div>
</footer>

<!-- ── cart drawer ──────────────────────────────────────────────────────── -->
<dialog class="drawer" id="cartDrawer" aria-label="კალათა">
  <div class="drawer__inner">
    <div class="drawer__head">
      <h2 class="drawer__title" id="cartTitle">კალათა</h2>
      <button class="icon-btn" id="cartClose" aria-label="დახურვა">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
          <path d="m6 6 12 12M18 6 6 18"/>
        </svg>
      </button>
    </div>
    <div class="drawer__body" id="cartBody"></div>
    <div class="drawer__foot" id="cartFoot"></div>
  </div>
</dialog>

<!-- ── mobile menu ──────────────────────────────────────────────────────── -->
<dialog class="drawer drawer--left" id="menuDrawer" aria-label="მენიუ">
  <div class="drawer__inner">
    <div class="drawer__head">
      <span class="logo">
        <svg viewBox="0 0 40 40" fill="none" aria-hidden="true">
          <circle cx="20" cy="16.5" r="9.5" stroke="var(--accent)" stroke-width="2.6" stroke-linecap="round"/>
          <path d="M5 29.5h30" stroke="currentColor" stroke-width="2.8" stroke-linecap="round"/>
          <path d="M12 34.5h16" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" opacity=".35"/>
        </svg>
        <span class="logo__word">i<b>Land</b></span>
      </span>
      <button class="icon-btn" id="menuClose" aria-label="დახურვა">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
          <path d="m6 6 12 12M18 6 6 18"/>
        </svg>
      </button>
    </div>
    <div class="drawer__body"><nav id="menuList" aria-label="კატეგორიები"></nav></div>
    <div class="drawer__foot" id="menuFoot"></div>
  </div>
</dialog>

<!-- ── repair booking ───────────────────────────────────────────────────── -->
<dialog class="drawer" id="bookDrawer" aria-label="სერვისზე ჩაწერა">
  <div class="drawer__inner">
    <div class="drawer__head">
      <h2 class="drawer__title" id="bookTitle">სერვისზე ჩაწერა</h2>
      <button class="icon-btn" id="bookClose" aria-label="დახურვა">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
          <path d="m6 6 12 12M18 6 6 18"/>
        </svg>
      </button>
    </div>
    <div class="drawer__body" id="bookBody"></div>
    <div class="drawer__foot" id="bookFoot"></div>
  </div>
</dialog>

<div class="toast-zone" id="toastZone" aria-live="polite" aria-atomic="false"></div>

<script type="module" src="js/app.js"></script>
</body>
</html>
